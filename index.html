<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8F%80</text></svg>">
<title>Calendar - SC Farense - Basketball - Senior Men</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #e8ebf0;
    --card: #ffffff;
    --text: #14151a;
    --muted: #4d525b;
    --border: #c3c9d3;
    --title: #52575f;
    --home-accent: #ad4409;
    /* Light theme needs the cards lifted off the page: the border alone is
       subtle at this size. Dark keeps the flat look. */
    --card-shadow: 0 1px 2px rgba(16, 24, 40, .06);
    --accent: #d2161e;
    --toast-bg: #1b1b1f;
    --toast-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317;
      --card: #1b1e24;
      --text: #eceef1;
      --muted: #9aa0a8;
      --border: #2b2f37;
      --title: #8f8f8f;
      --home-accent: #ff9262;
      --card-shadow: none;
      --accent: #e5323a;
      --toast-bg: #eceef1;
      --toast-text: #111317;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Dots", system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  /* On large screens the page is scaled up like Ctrl + + would do, so it
     does not look tiny on a big monitor. */
  @media (min-width: 1200px) {
    html { zoom: 1.5; }
    /* CSS zoom does not scale viewport units, so the full height is
       divided by the zoom to keep the footer glued to the bottom. */
    body { min-height: calc(100vh / 1.5); }
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
  }
  .titles {
    text-align: center;
  }
  .titles h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 400;
    letter-spacing: .01em;
    color: var(--title);
  }
  .titles h1 + h1 {
    margin-top: .4rem;
    font-size: 1rem;
  }
  #toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translate(-50%, .5rem);
    padding: .6rem 1rem;
    border-radius: .5rem;
    background: var(--toast-bg);
    color: var(--toast-text);
    font-size: .9rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    width: min(34rem, 100%);
    margin: 1.75rem auto 0;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    font-size: .85rem;
    color: var(--muted);
  }
  .footer-above {
    display: flex;
    justify-content: flex-end;
    width: min(34rem, 100%);
    margin: 1rem auto 0;
  }
  .footer-above .title-ball {
    --ball-rest: -16px;
    position: relative;
    display: inline-flex;
    align-items: center;
    padding: .3rem;
    margin: -.3rem;
    border: 0;
    background: none;
    font: inherit;
    font-size: 1.25rem;
    line-height: 1;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transform: translateY(var(--ball-rest));
  }
  /* Invisible padding around the ball so it is easy to hit on a phone
     without moving it on the page. */
  .footer-above .title-ball::after {
    content: "";
    position: absolute;
    inset: -.75rem;
  }
  .footer-above .title-ball:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: .35rem;
  }
  footer .credit { margin: 0; font-size: .85rem; }
  .subs {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: .45rem;
  }
  .gcal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    padding: .5rem;
    border: 1px solid var(--border);
    border-radius: .5rem;
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: .9rem;
    cursor: pointer;
    text-decoration: none;
    box-shadow: var(--card-shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  a.gcal:hover, button.gcal:hover {
    border-color: var(--muted);
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  .gcal .brand {
    flex: none;
    width: 1.15rem;
    height: 1.15rem;
    border-radius: .2rem;
  }
  #games {
    width: min(34rem, 100%);
    margin-top: .75rem;
  }
  #games h2 {
    margin: 0 0 .65rem;
    font-size: .95rem;
    font-weight: 400;
    text-align: center;
    color: var(--text);
  }
  #games ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: .55rem;
  }
  #games a.game, #games .msg {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: .8rem;
    align-items: center;
    padding: .7rem .8rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: .65rem;
    box-shadow: var(--card-shadow);
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, box-shadow .15s, background-color .15s, transform .15s;
  }
  /* The date gets just enough room to stay on one line: Zen Dots is wide, so
     "Sat, 31 Oct 2026" needs ~9rem and a fixed column would wrap it. */
  #games a.game {
    grid-template-columns: max-content minmax(0, 1fr);
  }
  #games a.game:hover {
    border-color: color-mix(in srgb, var(--text) 22%, var(--border));
    background-color: color-mix(in srgb, var(--text) 4%, var(--card));
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    transform: translateY(-1px);
  }
  #games a.game:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #games .msg {
    justify-content: center;
    text-align: center;
    font-size: .8rem;
    color: var(--muted);
  }
  #games .when {
    text-align: left;
    /* Each card is its own grid, so "Today"/"Tomorrow" would otherwise make
       that card's date column narrower and knock the matchup text out of line
       with the other cards. 8.75rem is the width of "Sat, 31 Oct 2026". */
    min-width: 8.75rem;
  }
  #games .when .d { display: block; font-size: .75rem; line-height: 1.25; white-space: nowrap; }
  #games .when .t { display: block; font-size: .65rem; color: var(--muted); }
  #games .who { font-size: .8rem; line-height: 1.35; }
  #games .meta { font-size: .65rem; color: var(--muted); line-height: 1.35; }
  #games a.game.home .meta { color: var(--home-accent); }
  /* Glowing cards: a game today gets the animated gradient; games in the next
     six days get a static orange glow that fades with distance (tomorrow is
     6/7 strength, in six days 1/7; a week away is a regular card). The glow is
     a crisp 2px edge plus a blurred halo behind the card; the card's own
     opaque background hides the middle. */
  #games a.game.today,
  #games a.game.warm {
    position: relative;
  }
  #games a.game.today::before,
  #games a.game.today::after,
  #games a.game.warm::before,
  #games a.game.warm::after {
    content: "";
    position: absolute;
    inset: -2px;
    z-index: -1;
    border-radius: calc(.65rem + 2px);
    pointer-events: none;
  }
  #games a.game.today::before,
  #games a.game.today::after {
    background: linear-gradient(
      45deg,
      #ff595e,
      #ffca3a,
      #8ac926,
      #1982c4,
      #6a4c93,
      #ff6700
    );
    background-size: 400%;
    animation: gameGlow 20s linear infinite;
  }
  /* Today is deliberately louder than the static warm glow: a thicker ring,
     a wider halo and a slow breathing pulse. */
  #games a.game.today::before {
    inset: -3px;
    border-radius: calc(.65rem + 3px);
  }
  #games a.game.today::after {
    inset: -6px;
    border-radius: calc(.65rem + 6px);
    filter: blur(24px);
    opacity: .8;
    animation: gameGlow 20s linear infinite, gamePulse 3.2s ease-in-out infinite;
  }
  #games a.game.warm::before,
  #games a.game.warm::after {
    background: linear-gradient(45deg, #ffb347, #ff8c00, #ff6700, #ff4500);
    /* Set per card by games.js: 6/7 tomorrow ... 1/7 in six days. */
    opacity: var(--glow-strength, 0);
  }
  #games a.game.warm::after {
    filter: blur(18px);
    opacity: calc(var(--glow-strength, 0) * .75);
  }
  /* Hovering lifts the cards with a transform, which would make the card a
     stacking context and paint the glow above it instead of behind it. Keep
     the other hover feedback, just skip the lift on glowing cards. */
  #games a.game.today:hover,
  #games a.game.warm:hover {
    transform: none;
  }
  @keyframes gameGlow {
    0% { background-position: 0 0; }
    50% { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }
  @keyframes gamePulse {
    0%, 100% { opacity: .8; }
    50% { opacity: 1; }
  }
  /* Phones: the date would squeeze the matchup into a narrow strip next to
     it, so the card stacks and the date/time share one line. */
  @media (max-width: 30rem) {
    #games a.game {
      grid-template-columns: minmax(0, 1fr);
      gap: .35rem;
    }
    #games .when {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: .45rem;
      min-width: 0;
    }
    #games .when .d, #games .when .t { display: inline; }
  }
  @media (prefers-reduced-motion: reduce) {
    #games a.game, #games .msg, .gcal { transition: none; }
    #games a.game:hover { transform: none; }
    #games a.game.today::before, #games a.game.today::after { animation: none; }
  }
</style>
</head>
<body>
  <main>
  <div class="titles">
    <h1>Calendar - SC Farense 🏀</h1>
    <h1>Senior Men</h1>
  </div>

  <section id="games">
    <h2>Upcoming games</h2>
    <ul id="games-list"><li class="msg">Loading…</li></ul>
  </section>
  </main>

  <div class="footer-above">
    <button class="title-ball" type="button" aria-label="Bounce the basketball">
      <span aria-hidden="true">🏀</span>
    </button>
  </div>

  <footer>
    <p class="credit">Made with ❤️ by fmagno</p>

    <div class="subs">
      <button class="gcal" id="copy" type="button" title="Copy .ics url" aria-label="Copy .ics url"
              data-ics="https://fmagno.github.io/scf-cal/farense.ics">
        <img class="brand" src="media/ics_logo_gray.svg" data-color="media/ics_logo.svg" alt="" aria-hidden="true" width="20" height="20">
      </button>

      <a class="gcal" id="google" href="#" target="_blank" rel="noopener"
         title="Add to Google Calendar" aria-label="Add to Google Calendar">
      <img class="brand" src="media/google_calendar_gray.svg" data-color="media/google_calendar.svg" alt="" aria-hidden="true" width="20" height="20" loading="lazy">
      </a>

      <a class="gcal" id="apple" href="#" title="Add to Apple Calendar" aria-label="Add to Apple Calendar">
      <img class="brand" src="media/apple_calendar_gray.svg" data-color="media/apple_calendar.svg" alt="" aria-hidden="true" width="20" height="20" loading="lazy">
      </a>
    </div>

  </footer>

  <div id="toast" role="status" aria-live="polite">Link copied!</div>

<script src="games.js"></script>
<script>
  const URL_TO_COPY = document.getElementById("copy").dataset.ics;
  // Google's one-click subscribe (render?cid=) is broken with https:// URLs;
  // webcal:// is the workaround that reliably shows the confirmation dialog.
  const WEBCAL = URL_TO_COPY.replace(/^https:/, "webcal:");
  document.getElementById("google").href =
    "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(WEBCAL);
  // Safari (macOS/iOS) opens Calendar.app directly from a webcal:// link and
  // shows the "subscribe" confirmation. Other browsers may just ignore it.
  document.getElementById("apple").href = WEBCAL;

  // ---- brand icons ----
  // The buttons show grey icons until they are hovered, focused or pressed,
  // when they swap to the coloured version for a moment.
  document.querySelectorAll(".gcal img.brand").forEach((img) => {
    const grey = img.getAttribute("src");
    const colour = img.dataset.color;
    const button = img.closest(".gcal");
    let hovering = false;
    let focused = false;
    let flashing = false;
    let flashTimer;

    const paint = () => {
      img.src = hovering || focused || flashing ? colour : grey;
    };
    const flash = () => {
      flashing = true;
      paint();
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => {
        flashing = false;
        paint();
      }, 900);
    };

    button.addEventListener("pointerenter", () => { hovering = true; paint(); });
    button.addEventListener("pointerleave", () => { hovering = false; paint(); });
    button.addEventListener("focus", () => { focused = true; paint(); });
    button.addEventListener("blur", () => { focused = false; paint(); });
    button.addEventListener("click", flash);
  });

  const toast = document.getElementById("toast");
  let toastTimer;

  document.getElementById("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(URL_TO_COPY);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = URL_TO_COPY;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
  });

  // ---- upcoming games, parsed from the same farense.ics that is subscribed ----
  const gamesList = document.getElementById("games-list");

  const HOME_VENUE = "Pavilhão do Sporting Clube Farense";
  const MAPS_DIRECTIONS = "https://www.google.com/maps/dir/?api=1&destination=";
  // Exact pin of the home pavilion, the text search often lands elsewhere.
  const HOME_MAPS = "https://maps.app.goo.gl/XtaniZmDvKCKvg1r8";

  function renderGames(events) {
    const now = new Date();
    const today = lisbonDay(now);
    const upcoming = upcomingEvents(events, now);
    gamesList.textContent = "";
    if (!upcoming.length) {
      const li = document.createElement("li");
      li.className = "msg";
      li.textContent = "No upcoming games.";
      gamesList.append(li);
      return;
    }
    for (const ev of upcoming) {
      const dt = parseDTSTART(ev.DTSTART);
      const a = document.createElement("a");
      a.className = "game";
      const location = ev.LOCATION || "";
      const isHome = location.includes(HOME_VENUE);
      // Home games point at the exact pavilion pin, the others open
      // directions to the venue written in the calendar.
      let href;
      if (isHome) href = HOME_MAPS;
      else if (location) href = MAPS_DIRECTIONS + encodeURIComponent(location);
      else href = ev.URL || "#";
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      if (location) a.title = "Directions to " + location;
      if (isHome) a.classList.add("home");
      // Today glows with the animated gradient; the next six days get a static
      // orange glow that fades by one seventh per day.
      const daysAway = daysUntil(dt, today);
      const strength = glowStrength(daysAway);
      if (daysAway === 0) {
        a.classList.add("today");
      } else if (strength > 0) {
        a.classList.add("warm");
        a.style.setProperty("--glow-strength", strength);
      }

      const when = document.createElement("span");
      when.className = "when";
      const d = document.createElement("span");
      d.className = "d";
      d.textContent = formatGameDate(dt, today);
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = dt.time || "time TBD";
      when.append(d, t);

      const body = document.createElement("span");
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = ev.SUMMARY || "";
      body.append(who);
      if (ev.LOCATION) {
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = ev.LOCATION;
        meta.style.display = "block";
        body.append(meta);
      }

      a.append(when, body);
      gamesList.append(a);
    }
  }

  fetch("farense.ics")
    .then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then((text) => renderGames(parseEvents(text)))
    .catch(() => {
      gamesList.textContent = "";
      const li = document.createElement("li");
      li.className = "msg";
      li.textContent = "Could not load games — use the buttons below instead.";
      gamesList.append(li);
    });

  // ---- bouncing basketball ----
  // The ball starts a little above the footer. Clicking drops it onto the
  // line, where it bounces and stays; clicking again just taps it into a
  // small bounce. Only a refresh brings it back up to the starting height.
  // The drop uses the easeOutBounce curve from the Motion "bounce easing"
  // example (motion.dev/examples/js-bounce-easing).
  const ball = document.querySelector(".title-ball");
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)");

  // From https://easings.net/#easeOutBounce
  function bounceEase(x) {
    const n1 = 7.5625;
    const d1 = 2.75;
    if (x < 1 / d1) return n1 * x * x;
    if (x < 2 / d1) { x -= 1.5 / d1; return n1 * x * x + 0.75; }
    if (x < 2.5 / d1) { x -= 2.25 / d1; return n1 * x * x + 0.9375; }
    x -= 2.625 / d1;
    return n1 * x * x + 0.984375;
  }

  const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);

  function tweenY(el, from, to, duration, ease) {
    return new Promise((resolve) => {
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / duration);
        el.style.transform = `translateY(${from + (to - from) * ease(t)}px)`;
        if (t < 1) requestAnimationFrame(step);
        else resolve();
      };
      requestAnimationFrame(step);
    });
  }

  const BALL_REST = parseFloat(
    getComputedStyle(ball).getPropertyValue("--ball-rest")
  ) || 0;
  let ballDown = false;
  let bouncing = false;

  async function bounceBall() {
    if (bouncing) return;
    bouncing = true;
    if (calm.matches) {
      // no motion: drop it straight onto the line
      ballDown = true;
      ball.style.transform = "translateY(0px)";
      bouncing = false;
      return;
    }
    if (!ballDown) {
      // full drop from the starting height, then it stays on the line
      await tweenY(ball, BALL_REST, 0, 1200, bounceEase);
      ballDown = true;
    } else {
      // already down: tap it into a small bounce
      await tweenY(ball, 0, BALL_REST, 260, easeOutCubic);
      await tweenY(ball, BALL_REST, 0, 520, bounceEase);
    }
    ball.style.transform = "translateY(0px)";
    bouncing = false;
  }

  // pointerdown reacts on the first touch, the click handler is only for
  // keyboard activation (detail 0).
  ball.addEventListener("pointerdown", bounceBall);
  ball.addEventListener("click", (e) => {
    if (e.detail === 0) bounceBall();
  });
</script>
</body>
</html>
