name: Build calendar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and build .ics
        run: python scraper.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- farense.ics meta.json; then
            git config user.name "scf-ics-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add farense.ics meta.json
            git commit -m "chore: update calendar"
            git push
          fi
